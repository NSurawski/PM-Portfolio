            <button
              onClick={() => onPreview(template)}
              className="flex-1 px-3 py-2 text-xs font-semibold text-slate-700 bg-slate-100 hover:bg-slate-200 rounded-lg transition"
            >Preview</button>
            <button
              onClick={() => downloadMarkdown(template)}
              className="px-3 py-2 text-xs font-semibold text-white bg-slate-800 hover:bg-slate-900 rounded-lg transition"
              title="Download Markdown"
            >.md</button>
            <button
              onClick={() => downloadPDF(template)}
              className="px-3 py-2 text-xs font-semibold text-white bg-slate-800 hover:bg-slate-900 rounded-lg transition"
              title="Download PDF"
            >.pdf</button>
          </div>
        </div>
      );
    }

    function PreviewModal({ template, onClose }) {
      if (!template) return null;
      const cat = CATEGORIES[template.category];
      const s = CAT_STYLES[cat.color];
      const html = useMemo(() => marked.parse(template.markdown), [template]);
      return (
        <div className="fixed inset-0 z-50 flex items-start justify-center p-4 pt-8 sm:pt-16" onClick={onClose}>
          <div className="absolute inset-0 bg-slate-900/40 backdrop-blur-sm" />
          <div
            className="modal-enter relative bg-white rounded-2xl shadow-2xl w-full max-w-2xl max-h-[85vh] flex flex-col overflow-hidden"
            onClick={e => e.stopPropagation()}
          >
            {/* Header */}
            <div className="flex items-center justify-between px-6 py-4 border-b border-slate-100 flex-shrink-0">
              <div className="flex items-center gap-3">
                <div className={`w-8 h-8 rounded-lg ${s.iconBg} flex items-center justify-center`}>
                  <CategoryIcon path={cat.icon} className={s.iconText} />
                </div>
                <div>
                  <h2 className="text-sm font-bold text-slate-800">{template.title}</h2>
                  <span className={`text-[10px] font-bold uppercase tracking-wider ${s.badge} px-1.5 py-0.5 rounded`}>{cat.label}</span>
                </div>
              </div>
              <button onClick={onClose} className="p-2 hover:bg-slate-100 rounded-lg transition text-slate-400 hover:text-slate-600">
                <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}><path strokeLinecap="round" strokeLinejoin="round" d="M6 18L18 6M6 6l12 12" /></svg>
              </button>
            </div>
            {/* Body */}
            <div className="flex-1 overflow-y-auto px-6 py-5">
              <div className="prose" dangerouslySetInnerHTML={{ __html: html }} />
            </div>
            {/* Footer */}
            <div className="flex items-center justify-between px-6 py-4 border-t border-slate-100 bg-slate-50 flex-shrink-0">
              <span className="text-xs text-slate-400">Download and customize this template</span>
              <div className="flex gap-2">
                <button
                  onClick={() => downloadMarkdown(template)}
                  className="px-4 py-2 text-xs font-semibold text-slate-700 bg-white border border-slate-200 hover:bg-slate-100 rounded-lg transition"
                >Download .md</button>
                <button
                  onClick={() => downloadPDF(template)}
                  className="px-4 py-2 text-xs font-semibold text-white bg-slate-800 hover:bg-slate-900 rounded-lg transition"
                >Download .pdf</button>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // ============================
    // APP
    // ============================
    function App() {
      const [search, setSearch] = useState("");
      const [category, setCategory] = useState(null);
      const [preview, setPreview] = useState(null);

      const filtered = useMemo(() => {
        let list = TEMPLATES;
        if (category) list = list.filter(t => t.category === category);
        if (search.trim()) {
          const q = search.toLowerCase();
          list = list.filter(t =>
            t.title.toLowerCase().includes(q) ||
            t.description.toLowerCase().includes(q) ||
            CATEGORIES[t.category].label.toLowerCase().includes(q)
          );
        }
        return list;
      }, [search, category]);

      return (
        <div className="max-w-5xl mx-auto px-5 py-10">
          {/* Header */}
          <div className="mb-10">
            <div className="flex items-center gap-3 mb-2">
              <div className="w-10 h-10 bg-slate-900 rounded-xl flex items-center justify-center">
                <svg className="w-5 h-5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}><path strokeLinecap="round" strokeLinejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" /></svg>
              </div>
              <div>
                <h1 className="text-xl font-extrabold text-slate-900 tracking-tight">PM Toolkit</h1>
                <p className="text-xs text-slate-500">Free templates & docs for product managers</p>
              </div>
            </div>
            <div className="flex items-center gap-2 mt-4 text-xs text-slate-400">
              <span className="font-semibold text-slate-600">{TEMPLATES.length}</span> templates across
              <span className="font-semibold text-slate-600">{Object.keys(CATEGORIES).length}</span> categories
              <span className="mx-1">|</span>
              Download as Markdown or PDF — no signup required
            </div>
          </div>

          {/* Search */}
          <div className="mb-6">
            <div className="relative">
              <svg className="absolute left-3.5 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}><path strokeLinecap="round" strokeLinejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" /></svg>
              <input
                type="text"
                value={search}
                onChange={e => setSearch(e.target.value)}
                placeholder="Search templates..."
                className="w-full pl-10 pr-4 py-3 bg-white border border-slate-200 rounded-xl text-sm text-slate-800 focus:ring-2 focus:ring-slate-200 focus:border-slate-400 outline-none shadow-sm transition placeholder:text-slate-400"
              />
            </div>
          </div>

          {/* Categories */}
          <CategoryNav selected={category} onSelect={setCategory} />

          {/* Grid */}
          <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
            {filtered.map(t => (
              <TemplateCard key={t.id} template={t} onPreview={setPreview} />
            ))}
          </div>

          {filtered.length === 0 && (
            <div className="text-center py-20">
              <svg className="w-12 h-12 mx-auto text-slate-300 mb-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={1}><path strokeLinecap="round" strokeLinejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" /></svg>
              <p className="text-sm font-medium text-slate-500">No templates found</p>
              <p className="text-xs text-slate-400 mt-1">Try a different search term or category</p>
            </div>
          )}

          {/* Preview Modal */}
          <PreviewModal template={preview} onClose={() => setPreview(null)} />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
